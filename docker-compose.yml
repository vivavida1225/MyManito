services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./data/db.sqlite3:/app/db.sqlite3
      - ./data/media:/app/media
      - ./data/static:/app/staticfiles
    expose:
      - "8000"
    environment:
      CHANNEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    restart: always

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./data/static:/usr/share/nginx/html/static:ro
      - ./data/media:/media:ro
    restart: always
