services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./data/media:/app/media
      - ./data/static:/app/staticfiles
    expose:
      - "8000"
    environment:
      CHANNEL_REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_quiz_questions && python manage.py collectstatic --noinput && exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    restart: always

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./data/static:/usr/share/nginx/html/static:ro
      - ./data/media:/media:ro
    restart: always
